$("#theme").onclick=()=>{const d=getComputedStyle(root).colorScheme==="dark";root.dataset.theme=d?"light":"dark";try{localStorage.setItem("theme",root.dataset.theme)}catch(e){}};
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t}catch(e){}
function spy(){const y=innerHeight*.4,top=id=>document.getElementById(id).getBoundingClientRect().top;let cur="home";IDS.forEach(id=>{if(top(id)<=y)cur=id});if(innerHeight+scrollY>=root.scrollHeight-4)cur="contact";document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===cur))}
addEventListener("scroll",spy,{passive:true});
render();
if("IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll(".rv").forEach(e=>io.observe(e))}else document.querySelectorAll(".rv").forEach(e=>e.classList.add("in"));
let lx=null;document.querySelectorAll(".big").forEach(h=>{h.addEventListener("pointermove",e=>{const d=lx===null?0:Math.abs(e.clientX-lx);lx=e.clientX;h.style.setProperty("--f",Math.min(8,3+d*.3)+"px")});h.addEventListener("pointerleave",()=>lx=null)});
</script>
</body>
</html>
