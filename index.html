<div class="stats">${t.stats.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("")}</div><p style="margin:0 0 14px">${t.sobre}</p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"><a class="btn" href="mailto:${D.email}">${I("mail", 16)}${t.mail}</a><a class="btn alt" href="${D.waLink}" target="_blank" rel="noreferrer">${I("chat", 16)}WhatsApp</a></div>
${t.dest.map(([a, b], i) => `<div class="card row">${I(D.di[i], 22)}<div><h3>${a}</h3><span class="mut">${b}</span></div></div>`).join("")}</div>`;
  },
  exp() {
    const t = T();
    return `<div class="pad"><h2>${t.expH}</h2><p class="mut" style="margin:0 0 14px">${t.expP}</p>${t.exp.map(([e, c, d]) => `<div class="card" style="border-left:3px solid var(--red)"><h3>${e}</h3><div class="mut" style="font-size:13px">${c}</div><p style="margin:6px 0 0">${d}</p></div>`).join("")}</div>`;
  },
  stack() {
    const t = T();
    return `<div class="pad"><h2>${t.stH}</h2><p class="mut" style="margin:0 0 14px">${t.stP}</p>${stackOf(t).map(([k, c, v]) => `<div class="card"><h3 style="display:flex;gap:8px;align-items:center">${k === "React JS" ? ATOM() : `<i style="width:9px;height:9px;border-radius:9px;background:${c}"></i>`}${k}</h3>${chips(v, c)}</div>`).join("")}</div>`;
  },
  projetos(w) {
    const t = T(), L = projs(t), sel = w.sel, p = L[sel];
    const mode = p ? "d" + sel : "g";
    const side = `<div class="side"><button class="${sel == null ? "on" : ""}" data-act="psel" data-i="-1">${I("folder", 16)}${t.all}</button>${L.map((x, i) => `<button class="${sel === i ? "on" : ""}" data-act="psel" data-i="${i}">${I(x.ic, 16)}${x.n}</button>`).join("")}</div>`;
    const addr = `<div class="addr"><button class="btn alt" data-act="psel" data-i="-1" aria-label="${t.back}" ${sel == null ? "disabled" : ""}>${I("back", 16)}</button><div>${t.path} › ${t.apps.projetos}${p ? " › " + p.n : ""}</div></div>`;
    const main = p
      ? `<div class="pad"><div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${Tile(p.ic, p.c, 58)}<div><h2>${p.n}</h2><span class="mut">${p.t}</span></div></div><p>${p.d}</p>${chips(p.s)}${p.l ? `<p style="margin-top:18px"><a class="btn" href="${p.l}" target="_blank" rel="noreferrer">${I("gh", 16)}${t.gh}</a></p>` : ""}</div>`
      : `<div class="pgrid fade">${L.map((x, i) => `<button class="pc" data-act="psel" data-i="${i}">${Tile(x.ic, x.c, 46)}<div><b>${x.n}</b><span class="s">${x.t}</span></div></button>`).join("")}</div>`;
    return `<div class="exp">${side}<div style="flex:1;min-width:0;display:flex;flex-direction:column">${addr}<div style="overflow:auto;flex:1">${main}</div></div></div>`;
  },
  cv() {
    const t = T(), H = t.cvH;
    return `<div><div class="addr"><div>CV.pdf</div><button class="btn" data-act="dl">${I("dl", 16)}${t.dl}</button></div><div class="pdf"><h2>${D.nome}</h2><p>${t.cargo} · ${t.local}</p><p>${D.email} · ${D.wa}</p>
<h3>${H[0]}</h3><p>${t.sobre}</p><h3>${H[1]}</h3><ul>${t.exp.map((e) => `<li><b>${e[0]}</b> — ${e[1]}</li>`).join("")}</ul>
<h3>${H[2]}</h3><ul>${projs(t).map((p) => `<li><b>${p.n}</b> — ${p.t}</li>`).join("")}</ul>
<h3>${H[3]}</h3><p>Laravel, React JS, Vue.js, Docker, REST APIs, Microservices, CI/CD.</p><h3>${H[4]}</h3><p>${t.edu}</p><h3>${H[5]}</h3><p>${t.awd}</p></div></div>`;
  },
  contactos() {
    const t = T();
    const L = [["mail", "Email", D.email, "mailto:" + D.email], ["chat", "WhatsApp", D.wa, D.waLink], ["li", "LinkedIn", "in/alcedo-dev-28574035b", D.linkedin], ["gh", "GitHub", "github.com/alcedode", GH]];
    return `<div class="pad"><h2>${t.ctH}</h2><p class="mut" style="margin:0 0 16px">${t.ctP}</p>${L.map(([i, n, v, h]) => `<a href="${h}" target="_blank" rel="noreferrer" class="card" style="display:flex;gap:14px;align-items:center;color:inherit;text-decoration:none">${Tile(i, ["#ff2d20", "#61dafb"], 40)}<div style="min-width:0"><b>${n}</b><div class="mut" style="overflow:hidden;text-overflow:ellipsis">${v}</div></div></a>`).join("")}</div>`;
  },
  leiame() { return `<pre style="margin:0;padding:20px;font-family:Consolas,ui-monospace,monospace;font-size:13px;white-space:pre-wrap">${esc(T().readme)}</pre>`; },
};
const renderBody = (w) => { $(".body", w.el).innerHTML = V[w.app](w); };

/* ---------- janelas ---------- */
const topWin = () => st.wins.filter((w) => !w.closing && !w.min).sort((a, b) => b.z - a.z)[0];
function paintWin(w, top) {
  const A = APPS[w.app], e = w.el, s = e.style;
  e.className = `win${w.max ? " max" : ""}${w.min ? " min" : ""}${w.closing ? " closing" : ""}${top ? " top" : ""}${w.dg ? " dg" : ""}`;
  s.zIndex = w.z;
  if (w.max) { s.left = "0"; s.top = "0"; s.width = "100%"; s.height = "calc(100% - var(--tb))"; }
  else { s.left = w.x + "px"; s.top = w.y + "px"; s.width = Math.min(A.w, innerWidth - 16) + "px"; s.height = Math.min(A.h, innerHeight - 100) + "px"; }
  $(".mx", e).innerHTML = I(w.max ? "rest" : "max", 14);
}
function syncTb(top) {
  const box = $("#tbapps"); if (!box) return;
  const apps = [...new Set(st.wins.filter((w) => !w.closing).map((w) => w.app))];
  $$(".tbn.run", box).forEach((b) => { if (!apps.includes(b.dataset.k)) b.remove(); });
  apps.forEach((a) => {
    let b = $(`.tbn.run[data-k="${a}"]`, box);
    if (!b) { b = document.createElement("button"); b.className = "tbn tin run"; b.dataset.act = "tb"; b.dataset.k = a; b.innerHTML = Tile(APPS[a].i, APPS[a].c, 26); box.appendChild(b); }
    b.title = T().apps[a]; b.classList.toggle("act", !!top && top.app === a);
  });
}
function refresh() { const top = topWin(); st.wins.forEach((w) => paintWin(w, top && w.id === top.id)); syncTb(top); }
function openApp(app, arg) {
  closeMenu();
  let w = st.wins.find((x) => x.app === app && !x.closing);
  if (w) { w.min = false; w.z = ++st.z; if (arg != null) { w.sel = arg; renderBody(w); } refresh(); return; }
  const n = st.wins.length;
  w = { id: st.id++, app, z: ++st.z, min: false, max: innerWidth < 700, x: 120 + (n % 6) * 34, y: 36 + (n % 6) * 30, sel: arg ?? null, closing: false, dg: false };
  const el = document.createElement("div"); w.el = el;
  el.innerHTML = `<div class="tb"><button class="bk" data-act="close" data-al="back">${I("back", 22)}</button><span class="ico" style="display:grid">${Tile(APPS[app].i, APPS[app].c, 20)}</span><span class="t" data-ap="${app}"></span><button class="mn" data-act="min" data-al="min">${I("min", 16)}</button><button class="mx" data-act="max" data-al="max"></button><button class="x" data-act="close" data-al="close">${I("x", 16)}</button></div><div class="body"></div>`;
  paintWin(w, true); renderBody(w);
  const tb = $(".tb", el); let d = null;
  tb.addEventListener("pointerdown", (e) => { if (mob() || w.max || e.target.closest("button")) return; d = [e.clientX - w.x, e.clientY - w.y]; w.dg = true; el.classList.add("dg"); tb.setPointerCapture(e.pointerId); });
  tb.addEventListener("pointermove", (e) => { if (!d) return; w.x = Math.max(0, e.clientX - d[0]); w.y = Math.max(0, Math.min(innerHeight - 100, e.clientY - d[1])); el.style.left = w.x + "px"; el.style.top = w.y + "px"; });
  const up = () => { d = null; w.dg = false; el.classList.remove("dg"); };
  tb.addEventListener("pointerup", up); tb.addEventListener("pointercancel", up);
  tb.addEventListener("dblclick", (e) => { if (!mob() && !e.target.closest("button")) { w.max = !w.max; refresh(); } });
  el.addEventListener("pointerdown", () => { if (st.menu) closeMenu(); const t = topWin(); if (!t || t.id !== w.id) { w.z = ++st.z; refresh(); } });
  st.wins.push(w); $("#shell").appendChild(el); paint();
}
function closeWin(w) { w.closing = true; refresh(); setTimeout(() => { w.el.remove(); st.wins = st.wins.filter((x) => x !== w); refresh(); }, 300); }

/* ---------- menu iniciar ---------- */
function renderMenuBody() {
  const m = $("#mbody"); if (!m) return;
  const t = T(), q = st.q.trim().toLowerCase();
  const items = [...KEYS.map((k) => ({ t: t.apps[k], k, i: APPS[k].i, c: APPS[k].c })), ...projs(t).map((p, i) => ({ t: p.n, s: p.t, k: "projetos", a: i, i: p.ic, c: p.c }))];
  const Row = (x) => `<button class="mi" data-act="open" data-k="${x.k}"${x.a != null ? ` data-a="${x.a}"` : ""}>${Tile(x.i, x.c, 36)}<span><b style="font-weight:500">${x.t}</b>${x.s ? `<div class="mut" style="font-size:11px">${x.s}</div>` : ""}</span></button>`;
  const res = q ? items.filter((x) => (x.t + (x.s || "")).toLowerCase().includes(q)) : null;
  const mode = res ? "r" : "p" + st.lang, fade = mode !== st.mode ? " fade" : ""; st.mode = mode;
  if (res) m.innerHTML = `<div class="res${fade}">${res.length ? res.map(Row).join("") : `<p class="mut" style="text-align:center">${esc(t.none(st.q.trim()))}</p>`}</div>`;
  else {
    const rec = [items.find((x) => x.k === "cv"), items.find((x) => x.k === "contactos"), items[KEYS.length], items[KEYS.length + 1]];
    m.innerHTML = `<div class="${fade.trim()}"><h4>${t.pinned}</h4><div class="mg">${KEYS.map((k) => `<button class="mi" data-act="open" data-k="${k}">${Tile(APPS[k].i, APPS[k].c, 42)}${t.apps[k]}</button>`).join("")}</div><h4>${t.rec}</h4><div class="ml">${rec.map(Row).join("")}</div></div>`;
  }
}
function paintMenu() {
  $("#menu").classList.toggle("open", st.menu); $("#menu").setAttribute("aria-hidden", !st.menu);
  $("#q").tabIndex = st.menu ? 0 : -1; $("#startbtn").classList.toggle("act", st.menu);
}
function closeMenu() {
  if (!st.menu) return;
  st.menu = false; paintMenu();
  setTimeout(() => { if (!st.menu) { st.q = ""; $("#q").value = ""; renderMenuBody(); } }, 300);
}

/* ---------- ecrãs: bloqueio · login · ambiente de trabalho ---------- */
function mountLock() {
  $("#lock")?.remove(); $("#login")?.remove();
  const l = document.createElement("div"); l.id = "lock"; l.className = "lock";
  l.innerHTML = WALL(true) + PILL + `<div class="clk"><b data-clock></b><span data-date></span></div><div class="hint"><div class="mono">AM</div><span data-t="hint"></span></div>`;
  l.addEventListener("click", (e) => { if (!e.target.closest(".pill")) unlock(); });
  root.appendChild(l); st.lk = "on"; paint();
}
function mountLogin() {
  $("#login")?.remove();
  const l = document.createElement("div"); l.id = "login"; l.className = "login";
  l.innerHTML = WALL(true) + PILL + `${AV}<h1>${D.nome}</h1><p data-t="cargo"></p><button class="go" id="gobtn" data-act="enter"><span data-t="enter"></span>${I("arrow", 18)}</button><small data-t="nopass"></small>`;
  root.appendChild(l); st.ld = ""; paint(); $("#gobtn").focus({ preventScroll: true });
}
function unlock() {
  if (st.lk !== "on") return;
  st.lk = "leaving"; const l = $("#lock"); l.classList.add("up"); mountLogin();
  setTimeout(() => { l.remove(); st.lk = "off"; }, 760);
}
function lock() { closeMenu(); $$(".toast").forEach((x) => x.remove()); mountLock(); }
function mountShell() {
  const sh = document.createElement("div"); sh.id = "shell"; sh.className = "shell";
  sh.innerHTML = `<div class="desk">${KEYS.map((k, i) => `<button class="ic" style="--i:${i}" data-act="icon" data-k="${k}">${Tile(APPS[k].i, APPS[k].c, 48)}<span data-ap="${k}"></span></button>`).join("")}</div>
<div class="menu" id="menu" aria-hidden="true"><label class="sr">${I("search", 18)}<input id="q" data-ph="search" autocomplete="off" tabindex="-1"></label><div id="mbody"></div>
<div class="mf"><div class="u"><span class="mono">AM</span><span class="nm">${D.nome}</span></div><div class="u">${LSW(false)}<button data-act="theme" data-al="themeLbl" data-ti="themeLbl"><span data-theme-ic="18"></span></button><button data-act="lock" data-al="lockBtn" data-ti="lockBtn">${I("lock", 18)}</button></div></div></div>
<div class="tbar"><div class="apps" id="tbapps"><button class="tbn" id="startbtn" data-act="menu" data-al="start" data-ti="start">${WINLOGO(22)}</button></div>
<div class="tray"><button class="tbn" style="width:38px;font-size:12px;font-weight:700" data-act="cyc" aria-label="Language" title="PT · EN · FR"><span data-langtxt></span></button><button class="tbn" style="width:38px" data-act="theme" data-al="themeLbl" data-ti="themeLbl"><span data-theme-ic="18"></span></button><div class="sys">${I("wifi", 15)}${I("vol", 15)}${I("bat", 15)}</div><div class="dt" data-sysdate></div></div></div>`;
  root.appendChild(sh); st.entered = true; renderMenuBody(); paint();
}
function entrar() {
  if (st.ld) return;
  st.ld = "loading"; const b = $("#gobtn"); b.disabled = true; b.innerHTML = `<span class="spin"></span><span data-t="entering"></span>`; paint();
  setTimeout(() => {
    st.ld = "out"; const lg = $("#login"); lg.classList.add("out");
    if (!st.entered) mountShell();
    setTimeout(() => lg.remove(), 560);
    if (st.first) { st.first = false; if (!mob()) setTimeout(() => openApp("sobre"), 1000); }
    setTimeout(() => {
      if (!$("#shell")) return;
      const e = document.createElement("div"); e.className = "toast"; e.innerHTML = `<span class="mono">AM</span><div><b data-t="wT"></b><span class="mut" data-t="wS"></span></div>`;
      $("#shell").appendChild(e); paint();
      setTimeout(() => e.classList.add("out"), 4700); setTimeout(() => e.remove(), 5200);
    }, 1300);
  }, 1200);
}
const paintSel = () => $$(".ic").forEach((b) => b.classList.toggle("sel", b.dataset.k === st.sel));

/* ---------- eventos ---------- */
const wOf = (el) => st.wins.find((w) => w.el === el.closest(".win"));
root.addEventListener("click", (e) => {
  if (!e.target.closest(".menu,.tbar,.win,.ic")) { if (st.menu) closeMenu(); if (st.sel) { st.sel = null; paintSel(); } }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const d = a.dataset;
  switch (d.act) {
    case "icon": closeMenu(); if (tap()) openApp(d.k); else { st.sel = d.k; paintSel(); } break;
    case "open": openApp(d.k, d.a != null && d.a !== "" ? +d.a : undefined); break;
    case "close": closeWin(wOf(a)); break;
    case "min": { const w = wOf(a); w.min = true; refresh(); break; }
    case "max": { const w = wOf(a); w.max = !w.max; refresh(); break; }
    case "psel": { const w = wOf(a); w.sel = +d.i < 0 ? null : +d.i; renderBody(w); break; }
    case "lang": setLang(d.l); break;
    case "cyc": setLang(LANGS[(LANGS.indexOf(st.lang) + 1) % LANGS.length]); break;
    case "theme": toggleTheme(); break;
    case "lock": lock(); break;
    case "menu": if (st.menu) closeMenu(); else { st.menu = true; paintMenu(); } break;
    case "tb": { const w = st.wins.filter((x) => x.app === d.k && !x.closing).sort((x, y) => y.z - x.z)[0], t = topWin(); if (t && t === w) { w.min = true; refresh(); } else openApp(d.k); break; }
    case "enter": entrar(); break;
    case "dl": baixar(); break;
  }
});
root.addEventListener("dblclick", (e) => { const i = e.target.closest(".ic"); if (i) openApp(i.dataset.k); });
root.addEventListener("input", (e) => { if (e.target.id === "q") { st.q = e.target.value; renderMenuBody(); } });
addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); if (st.lk === "on") unlock(); });
addEventListener("wheel", (e) => { if (e.deltaY > 0 && st.lk === "on") unlock(); }, { passive: true });
let ty = 0;
addEventListener("touchstart", (e) => (ty = e.touches[0].clientY), { passive: true });
addEventListener("touchend", (e) => { if (st.lk === "on" && ty - e.changedTouches[0].clientY > 40) unlock(); }, { passive: true });
addEventListener("resize", refresh);

document.documentElement.lang = st.lang;
mountLock(); setInterval(tick, 1000);
})();

</script>
</body>
</html>
